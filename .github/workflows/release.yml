name: Release companion

# Runs when a GitHub Release is published on this repo. Builds the Android
# APK using whatever version is already committed in pubspec.yaml, and
# attaches the APK to that release.
#
# Versioning is manual: bump pubspec.yaml's version yourself, commit, then
# publish a release on that commit - this workflow only builds and attaches,
# it never creates or edits the release.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build and attach
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 
          flutter-version: '3.47.0'
          cache: true

      - name: Set up release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.jks
          cat > android/key.properties <<PROPS
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../release.jks
          PROPS

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/stardew-ds-companion-${{ github.event.release.tag_name }}.apk"

      - name: Upload APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "out/stardew-ds-companion-${{ github.event.release.tag_name }}.apk" --clobber
